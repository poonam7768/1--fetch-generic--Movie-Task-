<div class="backdrop closeform" id="backdrop"></div>
<form id="movieform">
    <div class="card">
        <div class="card-header d-flex justify-content-between">
            <h4>Add Movies</h4>
            <i role="button" id="closeform" class="fa-solid fa-xmark fa-2x closeform"></i>
        </div>
        <div class="card-body">
            <div class="form-group">
                <label for="movieName">Enter Movie Name</label>
                <input type="text" required id="movieName" class="form-control">
            </div>
            <div class="form-group">
                <label for="movieImg">Enter Movie URL</label>
                <input type="text" required id="movieImg" class="form-control">
            </div>

            <div class="form-group">
                <label for="movieImg">Enter Movie Discription</label>
                <textarea type="text" required id="moviediscription" rows="4" class="form-control"></textarea>
            </div>

            <div class="form-group">
                <label for="movieRating">Give Rating</label>
                <select id="movieRating" class="form-control">
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                </select>
            </div>
        </div>
        <div class="card-footer d-flex justify-content-between">
            <button type="submit" id="movieAddbtn" class="btn btn-sm net-sec-btn">Add Movie</button>
            <button type="button" id="updateMoviebtn" class="btn btn-sm net-sec-btn d-none">update Movie </button>
            <button type="button" class="btn btn-sm net-primary-btn closeform">cancle</button>
        </div>
    </div>
</form>
